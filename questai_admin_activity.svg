<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 680" width="100%" height="100%">
  <!-- Definitions for arrow markers -->
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#000000" />
    </marker>
  </defs>

  <!-- Background -->
  <rect width="800" height="680" fill="#ffffff" />

  <!-- Title above diagram -->
  <text x="400" y="30" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#000000" text-anchor="middle">
    QuestAI - Admin Activity Diagram
  </text>

  <!-- ================= LOGFLOW WORKFLOW ================= -->

  <!-- Start State -->
  <circle cx="400" cy="80" r="12" fill="#000000" />
  
  <!-- Arrow from Start to Login -->
  <path d="M 400 92 L 400 120" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow)" fill="none" />

  <!-- Login Action -->
  <g id="act-login">
    <rect x="340" y="120" width="120" height="40" rx="15" ry="15" fill="#ffffff" stroke="#000000" stroke-width="1.8" />
    <text x="400" y="144" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#000000" text-anchor="middle">Login</text>
  </g>

  <!-- Arrow from Login to Is Valid? Decision -->
  <path d="M 400 160 L 400 190" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow)" fill="none" />

  <!-- Decision: Is Valid? -->
  <g id="dec-valid">
    <!-- Diamond points: (400, 190) -> (460, 215) -> (400, 240) -> (340, 215) -->
    <polygon points="400,190 460,215 400,240 340,215" fill="#ffffff" stroke="#000000" stroke-width="1.8" />
    <text x="400" y="219" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#000000" text-anchor="middle">Is Valid?</text>
  </g>

  <!-- No path (Loop back to Login) -->
  <!-- Line from left point (340, 215) to left offset (290, 215) -->
  <!-- Line up to login level (290, 140) -->
  <!-- Line right to login box (340, 140) -->
  <path d="M 340 215 L 290 215 L 290 140 L 331 140" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow)" fill="none" />
  <text x="270" y="195" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#000000">No</text>

  <!-- Yes path to Fork Bar -->
  <path d="M 400 240 L 400 278" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow)" fill="none" />
  <text x="410" y="255" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#000000">Yes</text>

  <!-- Fork Bar -->
  <line x1="80" y1="280" x2="720" y2="280" stroke="#000000" stroke-width="4" />

  <!-- ================= PARALLEL ACTIVITIES ================= -->

  <!-- Column 1: Manage Users -->
  <path d="M 160 282 L 160 320" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow)" fill="none" />
  <g id="act-manage-users">
    <rect x="100" y="320" width="120" height="40" rx="15" ry="15" fill="#ffffff" stroke="#000000" stroke-width="1.8" />
    <text x="160" y="344" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#000000" text-anchor="middle">Manage Users</text>
  </g>
  <path d="M 160 360 L 160 488" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow)" fill="none" />

  <!-- Column 2: Moderate Quizzes & Docs (Two-stage activity) -->
  <path d="M 320 282 L 320 320" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow)" fill="none" />
  <g id="act-moderate-content">
    <rect x="255" y="320" width="130" height="40" rx="15" ry="15" fill="#ffffff" stroke="#000000" stroke-width="1.8" />
    <text x="320" y="344" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#000000" text-anchor="middle">Moderate Content</text>
  </g>
  <path d="M 320 360 L 320 390" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow)" fill="none" />
  <g id="act-delete-flagged">
    <rect x="250" y="390" width="140" height="40" rx="15" ry="15" fill="#ffffff" stroke="#000000" stroke-width="1.8" />
    <text x="320" y="414" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#000000" text-anchor="middle">Delete Flagged Items</text>
  </g>
  <path d="M 320 430 L 320 488" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow)" fill="none" />

  <!-- Column 3: Configure AI API Settings -->
  <path d="M 480 282 L 480 320" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow)" fill="none" />
  <g id="act-config-ai">
    <rect x="415" y="320" width="130" height="40" rx="15" ry="15" fill="#ffffff" stroke="#000000" stroke-width="1.8" />
    <text x="480" y="344" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#000000" text-anchor="middle">Configure AI API</text>
  </g>
  <path d="M 480 360 L 480 488" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow)" fill="none" />

  <!-- Column 4: Monitor Logs & Analytics -->
  <path d="M 640 282 L 640 320" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow)" fill="none" />
  <g id="act-monitor">
    <rect x="575" y="320" width="130" height="40" rx="15" ry="15" fill="#ffffff" stroke="#000000" stroke-width="1.8" />
    <text x="640" y="344" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#000000" text-anchor="middle">Monitor Analytics</text>
  </g>
  <path d="M 640 360 L 640 488" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow)" fill="none" />

  <!-- ================= JOIN & END FLOW ================= -->

  <!-- Join Bar -->
  <line x1="80" y1="490" x2="720" y2="490" stroke="#000000" stroke-width="4" />

  <!-- Arrow from Join Bar to Logout -->
  <path d="M 400 494 L 400 530" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow)" fill="none" />

  <!-- Logout Action -->
  <g id="act-logout">
    <rect x="340" y="530" width="120" height="40" rx="15" ry="15" fill="#ffffff" stroke="#000000" stroke-width="1.8" />
    <text x="400" y="554" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#000000" text-anchor="middle">Logout</text>
  </g>

  <!-- Arrow from Logout to End State -->
  <path d="M 400 570 L 400 610" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow)" fill="none" />

  <!-- End State (Bullseye) -->
  <g id="end-state">
    <circle cx="400" cy="620" r="12" fill="none" stroke="#000000" stroke-width="2" />
    <circle cx="400" cy="620" r="7" fill="#000000" />
  </g>
</svg>
