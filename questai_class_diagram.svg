<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1250 900" width="100%" height="100%">
  <!-- Background -->
  <rect width="1250" height="900" fill="#ffffff" />

  <!-- Title above diagram -->
  <text x="625" y="35" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#000000" text-anchor="middle">
    QuestAI - UML Class Diagram
  </text>

  <!-- ================= CLASSES (COMPARTMENTS) ================= -->

  <!-- 1. User Class (x=50, y=80, width=220, height=220) -->
  <g id="class-user">
    <rect x="50" y="80" width="220" height="220" fill="#ffffff" stroke="#000000" stroke-width="1.8" />
    <line x1="50" y1="110" x2="270" y2="110" stroke="#000000" stroke-width="1.5" />
    <line x1="50" y1="200" x2="270" y2="200" stroke="#000000" stroke-width="1.5" />
    <!-- Class Name -->
    <text x="160" y="100" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#000000" text-anchor="middle">User</text>
    <!-- Attributes -->
    <g font-family="Arial, sans-serif" font-size="11" fill="#000000">
      <text x="60" y="125">- id: Integer {PK}</text>
      <text x="60" y="139">- email: String</text>
      <text x="60" y="153">- fullName: String</text>
      <text x="60" y="167">- role: String</text>
      <text x="60" y="181">- status: String</text>
    </g>
    <!-- Operations -->
    <g font-family="Arial, sans-serif" font-size="11" fill="#000000">
      <text x="60" y="217">+ register(): Boolean</text>
      <text x="60" y="231">+ login(email, pass): Boolean</text>
      <text x="60" y="245">+ uploadDoc(title, file): Doc</text>
      <text x="60" y="259">+ attemptQuiz(quizId): Attempt</text>
      <text x="60" y="273">+ viewAnalytics(): List</text>
    </g>
  </g>

  <!-- 2. Document Class (x=400, y=80, width=220, height=200) -->
  <g id="class-document">
    <rect x="400" y="80" width="220" height="200" fill="#ffffff" stroke="#000000" stroke-width="1.8" />
    <line x1="400" y1="110" x2="620" y2="110" stroke="#000000" stroke-width="1.5" />
    <line x1="400" y1="180" x2="620" y2="180" stroke="#000000" stroke-width="1.5" />
    <!-- Class Name -->
    <text x="510" y="100" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#000000" text-anchor="middle">Document</text>
    <!-- Attributes -->
    <g font-family="Arial, sans-serif" font-size="11" fill="#000000">
      <text x="410" y="125">- id: Integer {PK}</text>
      <text x="410" y="139">- title: String</text>
      <text x="410" y="153">- fileName: String</text>
      <text x="410" y="167">- ownerId: Integer {FK}</text>
    </g>
    <!-- Operations -->
    <g font-family="Arial, sans-serif" font-size="11" fill="#000000">
      <text x="410" y="195">+ processText(): Boolean</text>
      <text x="410" y="209">+ parseStructure(): List</text>
      <text x="410" y="223">+ getChapters(): List</text>
    </g>
  </g>

  <!-- 3. Module Class (x=750, y=80, width=200, height=150) -->
  <g id="class-module">
    <rect x="750" y="80" width="200" height="150" fill="#ffffff" stroke="#000000" stroke-width="1.8" />
    <line x1="750" y1="110" x2="950" y2="110" stroke="#000000" stroke-width="1.5" />
    <line x1="750" y1="170" x2="950" y2="170" stroke="#000000" stroke-width="1.5" />
    <!-- Class Name -->
    <text x="850" y="100" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#000000" text-anchor="middle">Module</text>
    <!-- Attributes -->
    <g font-family="Arial, sans-serif" font-size="11" fill="#000000">
      <text x="760" y="125">- id: Integer {PK}</text>
      <text x="760" y="139">- documentId: Integer {FK}</text>
      <text x="760" y="153">- title: String</text>
    </g>
    <!-- Operations -->
    <g font-family="Arial, sans-serif" font-size="11" fill="#000000">
      <text x="760" y="185">+ addChapter(chap): Boolean</text>
      <text x="760" y="199">+ reorderModules(): List</text>
    </g>
  </g>

  <!-- 4. Chapter Class (x=750, y=280, width=200, height=170) -->
  <g id="class-chapter">
    <rect x="750" y="280" width="200" height="170" fill="#ffffff" stroke="#000000" stroke-width="1.8" />
    <line x1="750" y1="310" x2="950" y2="310" stroke="#000000" stroke-width="1.5" />
    <line x1="750" y1="380" x2="950" y2="380" stroke="#000000" stroke-width="1.5" />
    <!-- Class Name -->
    <text x="850" y="300" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#000000" text-anchor="middle">Chapter</text>
    <!-- Attributes -->
    <g font-family="Arial, sans-serif" font-size="11" fill="#000000">
      <text x="760" y="325">- id: Integer {PK}</text>
      <text x="760" y="339">- documentId: Integer {FK}</text>
      <text x="760" y="353">- moduleId: Integer {FK}</text>
      <text x="760" y="367">- title: String</text>
    </g>
    <!-- Operations -->
    <g font-family="Arial, sans-serif" font-size="11" fill="#000000">
      <text x="760" y="395">+ parseTopics(): List</text>
      <text x="760" y="409">+ updateContent(text): Bool</text>
    </g>
  </g>

  <!-- 5. Topic Class (x=1000, y=280, width=200, height=140) -->
  <g id="class-topic">
    <rect x="1000" y="280" width="200" height="140" fill="#ffffff" stroke="#000000" stroke-width="1.8" />
    <line x1="1000" y1="310" x2="1200" y2="310" stroke="#000000" stroke-width="1.5" />
    <line x1="1000" y1="370" x2="1200" y2="370" stroke="#000000" stroke-width="1.5" />
    <!-- Class Name -->
    <text x="1100" y="300" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#000000" text-anchor="middle">Topic</text>
    <!-- Attributes -->
    <g font-family="Arial, sans-serif" font-size="11" fill="#000000">
      <text x="1010" y="325">- id: Integer {PK}</text>
      <text x="1010" y="339">- chapterId: Integer {FK}</text>
      <text x="1010" y="353">- title: String</text>
    </g>
    <!-- Operations -->
    <g font-family="Arial, sans-serif" font-size="11" fill="#000000">
      <text x="1010" y="385">+ getDetails(): Topic</text>
    </g>
  </g>

  <!-- 6. Quiz Class (x=400, y=330, width=220, height=220) -->
  <g id="class-quiz">
    <rect x="400" y="330" width="220" height="220" fill="#ffffff" stroke="#000000" stroke-width="1.8" />
    <line x1="400" y1="360" x2="620" y2="360" stroke="#000000" stroke-width="1.5" />
    <line x1="400" y1="450" x2="620" y2="450" stroke="#000000" stroke-width="1.5" />
    <!-- Class Name -->
    <text x="510" y="350" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#000000" text-anchor="middle">Quiz</text>
    <!-- Attributes -->
    <g font-family="Arial, sans-serif" font-size="11" fill="#000000">
      <text x="410" y="375">- id: Integer {PK}</text>
      <text x="410" y="389">- title: String</text>
      <text x="410" y="403">- sourceType: String</text>
      <text x="410" y="417">- difficulty: String</text>
      <text x="410" y="431">- creatorId: Integer {FK}</text>
    </g>
    <!-- Operations -->
    <g font-family="Arial, sans-serif" font-size="11" fill="#000000">
      <text x="410" y="465">+ generateAIQuestions(): List</text>
      <text x="410" y="479">+ editQuestion(id, txt): Bool</text>
      <text x="410" y="493">+ deleteQuiz(): Boolean</text>
    </g>
  </g>

  <!-- 7. QuizAttempt Class (x=50, y=360, width=220, height=190) -->
  <g id="class-quizattempt">
    <rect x="50" y="360" width="220" height="190" fill="#ffffff" stroke="#000000" stroke-width="1.8" />
    <line x1="50" y1="390" x2="270" y2="390" stroke="#000000" stroke-width="1.5" />
    <line x1="50" y1="475" x2="270" y2="475" stroke="#000000" stroke-width="1.5" />
    <!-- Class Name -->
    <text x="160" y="380" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#000000" text-anchor="middle">QuizAttempt</text>
    <!-- Attributes -->
    <g font-family="Arial, sans-serif" font-size="11" fill="#000000">
      <text x="60" y="405">- id: Integer {PK}</text>
      <text x="60" y="419">- userId: Integer {FK}</text>
      <text x="60" y="433">- quizId: Integer {FK}</text>
      <text x="60" y="447">- score: Float</text>
      <text x="60" y="461">- timeSpent: Integer</text>
    </g>
    <!-- Operations -->
    <g font-family="Arial, sans-serif" font-size="11" fill="#000000">
      <text x="60" y="490">+ submitAns(answers): Float</text>
      <text x="60" y="504">+ calculateScore(): Float</text>
    </g>
  </g>

  <!-- 8. Question Class (x=400, y=600, width=220, height=210) -->
  <g id="class-question">
    <rect x="400" y="600" width="220" height="210" fill="#ffffff" stroke="#000000" stroke-width="1.8" />
    <line x1="400" y1="630" x2="620" y2="630" stroke="#000000" stroke-width="1.5" />
    <line x1="400" y1="720" x2="620" y2="720" stroke="#000000" stroke-width="1.5" />
    <!-- Class Name -->
    <text x="510" y="620" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#000000" text-anchor="middle">Question</text>
    <!-- Attributes -->
    <g font-family="Arial, sans-serif" font-size="11" fill="#000000">
      <text x="410" y="645">- id: Integer {PK}</text>
      <text x="410" y="659">- quizId: Integer {FK}</text>
      <text x="410" y="673">- questionText: Text</text>
      <text x="410" y="687">- type: String</text>
      <text x="410" y="701">- points: Integer</text>
    </g>
    <!-- Operations -->
    <g font-family="Arial, sans-serif" font-size="11" fill="#000000">
      <text x="410" y="735">+ addOption(txt, ok): Bool</text>
      <text x="410" y="749">+ validateAns(id): Bool</text>
    </g>
  </g>

  <!-- 9. Option Class (x=750, y=600, width=200, height=140) -->
  <g id="class-option">
    <rect x="750" y="600" width="200" height="140" fill="#ffffff" stroke="#000000" stroke-width="1.8" />
    <line x1="750" y1="630" x2="950" y2="630" stroke="#000000" stroke-width="1.5" />
    <line x1="750" y1="685" x2="950" y2="685" stroke="#000000" stroke-width="1.5" />
    <!-- Class Name -->
    <text x="850" y="620" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#000000" text-anchor="middle">Option</text>
    <!-- Attributes -->
    <g font-family="Arial, sans-serif" font-size="11" fill="#000000">
      <text x="760" y="645">- id: Integer {PK}</text>
      <text x="760" y="659">- questionId: Integer {FK}</text>
      <text x="760" y="673">- isCorrect: Boolean</text>
    </g>
    <!-- Operations -->
    <g font-family="Arial, sans-serif" font-size="11" fill="#000000">
      <text x="760" y="700">+ toggleCorrect(): Bool</text>
    </g>
  </g>

  <!-- 10. UserAnswer Class (x=50, y=600, width=220, height=190) -->
  <g id="class-useranswer">
    <rect x="50" y="600" width="220" height="190" fill="#ffffff" stroke="#000000" stroke-width="1.8" />
    <line x1="50" y1="630" x2="270" y2="630" stroke="#000000" stroke-width="1.5" />
    <line x1="50" y1="715" x2="270" y2="715" stroke="#000000" stroke-width="1.5" />
    <!-- Class Name -->
    <text x="160" y="620" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#000000" text-anchor="middle">UserAnswer</text>
    <!-- Attributes -->
    <g font-family="Arial, sans-serif" font-size="11" fill="#000000">
      <text x="60" y="645">- id: Integer {PK}</text>
      <text x="60" y="659">- attemptId: Integer {FK}</text>
      <text x="60" y="673">- questionId: Integer {FK}</text>
      <text x="60" y="687">- selectedOptionId: Int {FK}</text>
      <text x="60" y="701">- isCorrect: Boolean</text>
    </g>
    <!-- Operations -->
    <g font-family="Arial, sans-serif" font-size="11" fill="#000000">
      <text x="60" y="730">+ verifyAnswer(): Bool</text>
    </g>
  </g>

  <!-- ================= ASSOCIATIONS & MULTIPLICITY ================= -->

  <!-- User (50,80) -> Document (400,80) -->
  <path d="M 270 150 L 400 150" stroke="#000000" stroke-width="1.2" fill="none" />
  <text x="280" y="145" font-family="Arial, sans-serif" font-size="11" fill="#000000">1</text>
  <text x="385" y="145" font-family="Arial, sans-serif" font-size="11" fill="#000000">*</text>

  <!-- User (50,80) -> Quiz (400,330) -->
  <path d="M 270 200 L 400 350" stroke="#000000" stroke-width="1.2" fill="none" />
  <text x="285" y="195" font-family="Arial, sans-serif" font-size="11" fill="#000000">1</text>
  <text x="385" y="340" font-family="Arial, sans-serif" font-size="11" fill="#000000">*</text>

  <!-- User (50,80) -> QuizAttempt (50,360) -->
  <path d="M 160 300 L 160 360" stroke="#000000" stroke-width="1.2" fill="none" />
  <text x="145" y="315" font-family="Arial, sans-serif" font-size="11" fill="#000000">1</text>
  <text x="145" y="350" font-family="Arial, sans-serif" font-size="11" fill="#000000">*</text>

  <!-- Document (400,80) -> Module (750,80) -->
  <path d="M 620 150 L 750 150" stroke="#000000" stroke-width="1.2" fill="none" />
  <text x="630" y="145" font-family="Arial, sans-serif" font-size="11" fill="#000000">1</text>
  <text x="735" y="145" font-family="Arial, sans-serif" font-size="11" fill="#000000">*</text>

  <!-- Document (400,80) -> Chapter (750,280) -->
  <path d="M 620 180 L 750 300" stroke="#000000" stroke-width="1.2" fill="none" />
  <text x="635" y="185" font-family="Arial, sans-serif" font-size="11" fill="#000000">1</text>
  <text x="735" y="290" font-family="Arial, sans-serif" font-size="11" fill="#000000">*</text>

  <!-- Document (400,80) -> Quiz (400,330) -->
  <path d="M 510 280 L 510 330" stroke="#000000" stroke-width="1.2" fill="none" />
  <text x="495" y="295" font-family="Arial, sans-serif" font-size="11" fill="#000000">0..1</text>
  <text x="495" y="325" font-family="Arial, sans-serif" font-size="11" fill="#000000">*</text>

  <!-- Module (750,80) -> Chapter (750,280) -->
  <path d="M 850 230 L 850 280" stroke="#000000" stroke-width="1.2" fill="none" />
  <text x="835" y="245" font-family="Arial, sans-serif" font-size="11" fill="#000000">1</text>
  <text x="835" y="270" font-family="Arial, sans-serif" font-size="11" fill="#000000">*</text>

  <!-- Chapter (750,280) -> Topic (1000,280) -->
  <path d="M 950 350 L 1000 350" stroke="#000000" stroke-width="1.2" fill="none" />
  <text x="960" y="345" font-family="Arial, sans-serif" font-size="11" fill="#000000">1</text>
  <text x="985" y="345" font-family="Arial, sans-serif" font-size="11" fill="#000000">*</text>

  <!-- Quiz (400,330) -> Question (400,600) -->
  <path d="M 510 550 L 510 600" stroke="#000000" stroke-width="1.2" fill="none" />
  <text x="495" y="565" font-family="Arial, sans-serif" font-size="11" fill="#000000">1</text>
  <text x="495" y="590" font-family="Arial, sans-serif" font-size="11" fill="#000000">*</text>

  <!-- Quiz (400,330) -> QuizAttempt (50,360) -->
  <path d="M 400 480 L 270 480" stroke="#000000" stroke-width="1.2" fill="none" />
  <text x="385" y="475" font-family="Arial, sans-serif" font-size="11" fill="#000000">1</text>
  <text x="280" y="475" font-family="Arial, sans-serif" font-size="11" fill="#000000">*</text>

  <!-- Question (400,600) -> Option (750,600) -->
  <path d="M 620 680 L 750 650" stroke="#000000" stroke-width="1.2" fill="none" />
  <text x="635" y="682" font-family="Arial, sans-serif" font-size="11" fill="#000000">1</text>
  <text x="735" y="658" font-family="Arial, sans-serif" font-size="11" fill="#000000">2..*</text>

  <!-- QuizAttempt (50,360) -> UserAnswer (50,600) -->
  <path d="M 160 550 L 160 600" stroke="#000000" stroke-width="1.2" fill="none" />
  <text x="145" y="565" font-family="Arial, sans-serif" font-size="11" fill="#000000">1</text>
  <text x="145" y="590" font-family="Arial, sans-serif" font-size="11" fill="#000000">*</text>

  <!-- Question (400,600) -> UserAnswer (50,600) -->
  <path d="M 400 700 L 270 700" stroke="#000000" stroke-width="1.2" fill="none" />
  <text x="385" y="695" font-family="Arial, sans-serif" font-size="11" fill="#000000">1</text>
  <text x="280" y="695" font-family="Arial, sans-serif" font-size="11" fill="#000000">*</text>
</svg>
