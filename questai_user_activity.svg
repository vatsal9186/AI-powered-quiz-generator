<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 710" width="100%" height="100%">
  <!-- Definitions for arrow markers -->
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#000000" />
    </marker>
  </defs>

  <!-- Background -->
  <rect width="800" height="710" fill="#ffffff" />

  <!-- Title above diagram -->
  <text x="400" y="30" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#000000" text-anchor="middle">
    QuestAI - User Activity Diagram
  </text>

  <!-- ================= INITIAL FLOW ================= -->

  <!-- Start State -->
  <circle cx="400" cy="70" r="12" fill="#000000" />
  
  <!-- Arrow from Start to New User? Decision -->
  <path d="M 400 82 L 400 110" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow)" fill="none" />

  <!-- Decision: New User? -->
  <g id="dec-new-user">
    <!-- Diamond points: (400, 110) -> (460, 135) -> (400, 160) -> (340, 135) -->
    <polygon points="400,110 460,135 400,160 340,135" fill="#ffffff" stroke="#000000" stroke-width="1.8" />
    <text x="400" y="139" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#000000" text-anchor="middle">New User?</text>
  </g>

  <!-- Yes Path -> Registration Action -->
  <path d="M 460 135 L 531 135" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow)" fill="none" />
  <text x="495" y="125" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#000000">Yes</text>

  <g id="act-registration">
    <rect x="540" y="115" width="120" height="40" rx="15" ry="15" fill="#ffffff" stroke="#000000" stroke-width="1.8" />
    <text x="600" y="139" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#000000" text-anchor="middle">Registration</text>
  </g>

  <!-- Arrow from Registration back into flow (just above Login) -->
  <path d="M 600 155 L 600 190 L 400 190" stroke="#000000" stroke-width="1.5" fill="none" />
  <path d="M 400 190 L 400 209" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow)" fill="none" />

  <!-- No Path directly to Login -->
  <path d="M 400 160 L 400 210" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow)" fill="none" />
  <text x="410" y="185" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#000000">No</text>

  <!-- Login Action -->
  <g id="act-login">
    <rect x="340" y="210" width="120" height="40" rx="15" ry="15" fill="#ffffff" stroke="#000000" stroke-width="1.8" />
    <text x="400" y="234" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#000000" text-anchor="middle">Login</text>
  </g>

  <!-- Arrow from Login to Is Valid? Decision -->
  <path d="M 400 250 L 400 280" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow)" fill="none" />

  <!-- Decision: Is Valid? -->
  <g id="dec-valid">
    <polygon points="400,280 460,305 400,330 340,305" fill="#ffffff" stroke="#000000" stroke-width="1.8" />
    <text x="400" y="309" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#000000" text-anchor="middle">Is Valid?</text>
  </g>

  <!-- No Path (Loop back to Login) -->
  <path d="M 340 305 L 290 305 L 290 230 L 331 230" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow)" fill="none" />
  <text x="270" y="285" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#000000">No</text>

  <!-- Yes Path to Fork Bar -->
  <path d="M 400 330 L 400 368" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow)" fill="none" />
  <text x="410" y="348" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#000000">Yes</text>

  <!-- Fork Bar -->
  <line x1="80" y1="370" x2="720" y2="370" stroke="#000000" stroke-width="4" />

  <!-- ================= PARALLEL ACTIVITIES ================= -->

  <!-- Column 1: Browse Quizzes -->
  <path d="M 160 372 L 160 400" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow)" fill="none" />
  <g id="act-browse">
    <rect x="100" y="400" width="120" height="40" rx="15" ry="15" fill="#ffffff" stroke="#000000" stroke-width="1.8" />
    <text x="160" y="424" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#000000" text-anchor="middle">Browse Quizzes</text>
  </g>
  <path d="M 160 440 L 160 548" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow)" fill="none" />

  <!-- Column 2: View Analytics / Progress -->
  <path d="M 320 372 L 320 400" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow)" fill="none" />
  <g id="act-analytics">
    <rect x="260" y="400" width="120" height="40" rx="15" ry="15" fill="#ffffff" stroke="#000000" stroke-width="1.8" />
    <text x="320" y="424" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#000000" text-anchor="middle">View Analytics</text>
  </g>
  <path d="M 320 440 L 320 548" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow)" fill="none" />

  <!-- Column 3: Upload Material & Generate Quiz (Two-stage activity) -->
  <path d="M 480 372 L 480 400" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow)" fill="none" />
  <g id="act-upload">
    <rect x="420" y="400" width="120" height="40" rx="15" ry="15" fill="#ffffff" stroke="#000000" stroke-width="1.8" />
    <text x="480" y="424" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#000000" text-anchor="middle">Upload Material</text>
  </g>
  <path d="M 480 440 L 480 470" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow)" fill="none" />
  <g id="act-generate">
    <rect x="410" y="470" width="140" height="40" rx="15" ry="15" fill="#ffffff" stroke="#000000" stroke-width="1.8" />
    <text x="480" y="494" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#000000" text-anchor="middle">Generate Quiz (AI)</text>
  </g>
  <path d="M 480 510 L 480 548" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow)" fill="none" />

  <!-- Column 4: Attempt Quiz & Review Score (Two-stage activity) -->
  <path d="M 640 372 L 640 400" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow)" fill="none" />
  <g id="act-attempt">
    <rect x="580" y="400" width="120" height="40" rx="15" ry="15" fill="#ffffff" stroke="#000000" stroke-width="1.8" />
    <text x="640" y="424" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#000000" text-anchor="middle">Attempt Quiz</text>
  </g>
  <path d="M 640 440 L 640 470" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow)" fill="none" />
  <g id="act-review">
    <rect x="580" y="470" width="120" height="40" rx="15" ry="15" fill="#ffffff" stroke="#000000" stroke-width="1.8" />
    <text x="640" y="494" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#000000" text-anchor="middle">Review Score</text>
  </g>
  <path d="M 640 510 L 640 548" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow)" fill="none" />

  <!-- ================= JOIN & END FLOW ================= -->

  <!-- Join Bar -->
  <line x1="80" y1="550" x2="720" y2="550" stroke="#000000" stroke-width="4" />

  <!-- Arrow from Join Bar to Logout -->
  <path d="M 400 554 L 400 580" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow)" fill="none" />

  <!-- Logout Action -->
  <g id="act-logout">
    <rect x="340" y="580" width="120" height="40" rx="15" ry="15" fill="#ffffff" stroke="#000000" stroke-width="1.8" />
    <text x="400" y="604" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#000000" text-anchor="middle">Logout</text>
  </g>

  <!-- Arrow from Logout to End State -->
  <path d="M 400 620 L 400 650" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow)" fill="none" />

  <!-- End State (Bullseye) -->
  <g id="end-state">
    <circle cx="400" cy="660" r="12" fill="none" stroke="#000000" stroke-width="2" />
    <circle cx="400" cy="660" r="7" fill="#000000" />
  </g>
</svg>
